<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBiCUE 의료기관 안내</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F0F8F8;
      color: #234650;
    }
    header {
      background: #102F60;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
    .info {
      padding: 12px;
      text-align: center;
      font-size: 13px;
    }
    #map {
      width: 100%;
      height: 65vh;
      min-height: 300px;
    }
    #status {
      padding: 12px;
      text-align: center;
      font-size: 13px;
    }
    .notice {
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: #647C80;
    }
  </style>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f9161da9ead43725697e78a88cc92a08&libraries=services"></script>
</head>
<body>
  <header>의료기관 안내</header>
  <div class="info">현재 위치 주변의 병원 및 보건소를 찾아드립니다.</div>
  <div id="map"></div>
  <div id="status">위치 정보를 확인하고 있습니다...</div>
  <div class="notice">
    ※ 표시된 의료기관의 결핵 검사 및 진료 가능 여부는 방문 전 해당 기관에 확인하시기 바랍니다.
  </div>

  <script>
    const statusEl = document.getElementById("status");

    function startMap(lat, lng, locationFound) {
      const center = new kakao.maps.LatLng(lat, lng);
      const map = new kakao.maps.Map(
        document.getElementById("map"),
        { center: center, level: 5 }
      );

      const places = new kakao.maps.services.Places();
let openedInfoWindow = null;
      function addMarker(place, type) {
        const position = new kakao.maps.LatLng(place.y, place.x);
        
const distance = Math.sqrt(
  Math.pow((Number(place.y) - center.getLat()) * 111000, 2) +
  Math.pow(
    (Number(place.x) - center.getLng()) *
    111000 * Math.cos(center.getLat() * Math.PI / 180),
    2
  )
);

if (distance > 5000) {
  return;
}

const markerColor = type === "보건소" ? "#D97735" : "#168B90";

const markerImage = new kakao.maps.MarkerImage(
  "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">
        <path d="M16 1C7.7 1 1 7.7 1 16c0 11 15 25 15 25s15-14 15-25C31 7.7 24.3 1 16 1Z"
              fill="${markerColor}" stroke="white" stroke-width="2"/>
        <circle cx="16" cy="16" r="6" fill="white"/>
      </svg>
    `),
  new kakao.maps.Size(32, 42)
);

const marker = new kakao.maps.Marker({
  map: map,
  position: position,
  image: markerImage
});


        const info = new kakao.maps.InfoWindow({
          content:
            '<div style="padding:8px;font-size:12px;min-width:130px;">' +
            '<strong>' + place.place_name + '</strong>' +
            '<div>' + type + '</div>' +
            '</div>'
        });

       
kakao.maps.event.addListener(marker, "click", function () {
  if (openedInfoWindow) {
    openedInfoWindow.close();
  }

  info.open(map, marker);
  openedInfoWindow = info;
});
      }

      const options = {
        location: center,
        radius: 5000
      };




/* 1. 결핵ZERO 등록 의료기관 8곳 */
const medicalInstitutions = [
  { name: "지정내과의원", address: "강원특별자치도 원주시 지정면 신지정로 266" },
  { name: "서울황내과의원", address: "강원특별자치도 원주시 능라동길 59" },
  { name: "도담내과의원", address: "강원특별자치도 원주시 모란1길 70" },
  { name: "연세대학교 원주세브란스기독병원", address: "강원특별자치도 원주시 일산로 20" },
  { name: "강원특별자치도원주의료원", address: "강원특별자치도 원주시 서원대로 387" },
  { name: "성지병원", address: "강원특별자치도 원주시 원일로 22" },
  { name: "원주성모병원", address: "강원특별자치도 원주시 소초면 치악로 2473" },
  { name: "손경수내과의원", address: "강원특별자치도 원주시 남원로 665" }
];

const geocoder = new kakao.maps.services.Geocoder();
const addedHospitalNames = new Set();

function normalizeName(name) {
  return name.replace(/\s/g, "");
}

/* 공식 등록 의료기관 표시 */
medicalInstitutions.forEach(function (hospital) {
  geocoder.addressSearch(hospital.address, function (result, status) {
    if (status !== kakao.maps.services.Status.OK) {
      console.warn("주소 검색 실패:", hospital.name);
      return;
    }

    const lat = Number(result[0].y);
    const lng = Number(result[0].x);

    const R = 6371000;
    const dLat = (lat - center.getLat()) * Math.PI / 180;
    const dLng = (lng - center.getLng()) * Math.PI / 180;

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(center.getLat() * Math.PI / 180) *
      Math.cos(lat * Math.PI / 180) *
      Math.sin(dLng / 2) ** 2;

    const distance = 2 * R * Math.asin(Math.sqrt(a));

    if (distance <= 5000) {
      const key = normalizeName(hospital.name);

      if (!addedHospitalNames.has(key)) {
        addedHospitalNames.add(key);

        addMarker({
          place_name: hospital.name,
          x: lng,
          y: lat
        }, "병원");
      }
    }
  });
});

/* 2. 주변 내과 의원 자동 검색 */

/* 주변 내과·가정의학과·종합병원 검색 */
const searchKeywords = ["내과", "호흡기내과", "가정의학과", "종합병원"];

searchKeywords.forEach(function (keyword) {
  places.keywordSearch(keyword, function (data, status, pagination) {
    if (status === kakao.maps.services.Status.OK) {
      data.forEach(function (place) {
        const name = place.place_name || "";
        const category = place.category_name || "";

        const allowed =
          /내과|호흡기|가정의학|종합병원|대학병원|의료원/.test(name + category);

        const excluded =
          /치과|안과|비뇨|한의원|피부과|성형외과|정형외과|이비인후과|정신건강의학과|정신과|산부인과|요양병원|동물병원|충전소/.test(name + category);

        const key = normalizeName(name);


if (allowed && !excluded && !addedHospitalNames.has(key)) {
  const lat = Number(place.y);
  const lng = Number(place.x);

  const R = 6371000;
  const dLat = (lat - center.getLat()) * Math.PI / 180;
  const dLng = (lng - center.getLng()) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(center.getLat() * Math.PI / 180) *
    Math.cos(lat * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;

  const distanceMeters = 2 * R * Math.asin(Math.sqrt(a));

  if (Number.isFinite(distanceMeters) && distanceMeters <= 5000) {
    addedHospitalNames.add(key);
    addMarker(place, "병원");
  }
}

      });

      if (pagination.hasNextPage) {
        pagination.nextPage();
      }
    }
  }, {
    location: center,
    radius: 5000,
    category_group_code: "HP8"
  });
});

places.keywordSearch("보건소", function (data, status, pagination) {
  if (status === kakao.maps.services.Status.OK) {
    data.forEach(function (place) {
      const name = place.place_name || "";
      const category = place.category_name || "";

      const isHealthCenter =
        /보건소|보건지소|보건진료소/.test(name);

      const isMedicalCategory =
        /의료|건강|보건/.test(category);

      const excluded =
        /충전|주차|전기차|카페|편의점/.test(name + category);

      const lat = Number(place.y);
      const lng = Number(place.x);

      const R = 6371000;
      const dLat = (lat - center.getLat()) * Math.PI / 180;
      const dLng = (lng - center.getLng()) * Math.PI / 180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(center.getLat() * Math.PI / 180) *
        Math.cos(lat * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;

      const distance = 2 * R * Math.asin(Math.sqrt(a));

      if (
        isHealthCenter &&
        isMedicalCategory &&
        !excluded &&
        distance <= 5000
      ) {
        addMarker(place, "보건소");
      }
    });

    if (pagination.hasNextPage) {
      pagination.nextPage();
    }
  }
}, options);




if (locationFound) {
  new kakao.maps.Circle({
    map: map,
    center: center,
    radius: 15,
    strokeWeight: 2,
    strokeColor: '#FFFFFF',
    fillColor: '#168BFF',
    fillOpacity: 0.9
  });
  
        statusEl.textContent = "현재 위치 기준 반경 5km 내 의료기관 검색";
      } else {
        statusEl.textContent =
          "현재 위치를 확인하지 못해 기본 지역을 표시합니다.";
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (position) {
          startMap(
            position.coords.latitude,
            position.coords.longitude,
            true
          );
        },
        function () {
          startMap(37.3422, 127.9202, false);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      startMap(37.3422, 127.9202, false);
    }
  </script>
</body>
</html>
